<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="J.A.R.V.I.S Mobile Edition - AI Assistant Interface"
    >

    <title>J.A.R.V.I.S Mobile Edition</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <!-- HEADER -->
        <header>

            <div class="brand">

                <div class="logo">
                    J
                </div>

                <div>
                    <h1>J.A.R.V.I.S</h1>

                    <p>
                        MOBILE EDITION
                    </p>
                </div>

            </div>

            <div class="status">
                <span></span>
                ONLINE
            </div>

        </header>


        <!-- REACTOR -->
        <section class="reactor-section">

            <div class="reactor">

                <div class="ring ring-1"></div>

                <div class="ring ring-2"></div>

                <div class="ring ring-3"></div>

                <div class="core">
                    <span>J</span>
                </div>

            </div>

            <h2>
                J.A.R.V.I.S
            </h2>

            <p>
                JUST A RATHER VERY INTELLIGENT SYSTEM
            </p>

        </section>


        <!-- SYSTEM STATUS -->
        <section class="systems">

            <div class="system-card">

                <span>⚡</span>

                <div>
                    <strong>CORE</strong>
                    <small>ONLINE</small>
                </div>

            </div>


            <div class="system-card">

                <span>🧠</span>

                <div>
                    <strong>AI ENGINE</strong>
                    <small>READY</small>
                </div>

            </div>


            <div class="system-card">

                <span>🌐</span>

                <div>
                    <strong>NETWORK</strong>
                    <small>CONNECTED</small>
                </div>

            </div>

        </section>


        <!-- CHAT -->
        <section class="chat-section">

            <div class="section-title">

                <span>
                    J.A.R.V.I.S TERMINAL
                </span>

                <span class="live">
                    ● LIVE
                </span>

            </div>


            <!-- Messages appear here -->
            <div id="chat">

                <div class="msg ai">
                    J.A.R.V.I.S: Systems online. How may I assist you, Boss?
                </div>

            </div>


            <!-- INPUT -->
            <div class="input-area">

                <input
                    type="text"
                    id="msg"
                    placeholder="Ask J.A.R.V.I.S..."
                    autocomplete="off"
                    aria-label="Message"
                >

                <button
                    id="send"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

        </section>


        <!-- FOOTER -->
        <footer>
            J.A.R.V.I.S MOBILE EDITION • SYSTEM READY
        </footer>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
